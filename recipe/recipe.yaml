schema_version: 1

context:
  version: 0.10.20260723

package:
  name: ibm-quantum-schemas
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ibm-quantum-schemas/ibm_quantum_schemas-${{ version }}.tar.gz
  sha256: e3435cd86140bf8e0d2fc09af9e7c3d799adb732928b99dc90079a7372197044

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - pybase64 >=1.3.0
    - pydantic >=2.11,<3.0.0
    - qiskit >=2.2.0,<3.0.0
    - samplomatic >=0.12.0
    - qiskit-qasm3-import >=0.5.0,<1.0.0
    - numpy >=1.26.2
tests:
  - python:
      imports:
        - ibm_quantum_schemas
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: IBM Quantum Pydantic models.
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/Qiskit/ibm-quantum-schemas

extra:
  recipe-maintainers:
    - wshanks
